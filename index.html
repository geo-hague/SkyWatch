<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SkyWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080b0f;
    --bg2: #0f1318;
    --bg3: #161c24;
    --amber: #f0a020;
    --amber-dim: #7a5010;
    --amber-glow: rgba(240,160,32,0.12);
    --green: #22dd88;
    --red: #ff4455;
    --blue: #44aaff;
    --text: #ddd8c8;
    --text-dim: #6b7280;
    --border: rgba(240,160,32,0.18);
    --border-dim: rgba(255,255,255,0.06);
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Barlow Condensed', sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100vh; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
    gap: 8px;
  }
  .logo { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.12em; color: var(--amber); flex-shrink: 0; }
  .logo span { opacity: 0.5; font-weight: 400; }
  .status-pill {
    font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.08em;
    padding: 4px 10px; border-radius: 20px; flex-shrink: 0;
    background: var(--amber-glow); border: 1px solid var(--amber-dim); color: var(--amber);
  }
  .status-pill.red { background: rgba(255,68,85,0.1); border-color: rgba(255,68,85,0.3); color: var(--red); }
  .status-pill.green { background: rgba(34,221,136,0.1); border-color: rgba(34,221,136,0.3); color: var(--green); }

  /* Compact compass in header */
  #hdr-compass {
    display: flex; align-items: center; gap: 7px; flex: 1;
    justify-content: center;
    cursor: pointer;
  }
  #compass-svg-mini { width: 30px; height: 30px; flex-shrink: 0; }
  #hdr-no-compass { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--amber-dim); letter-spacing: 0.06em; }
  #hdr-yes-compass { display: none; }
  .hdr-heading-deg { font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; color: var(--amber); line-height: 1; }
  .hdr-heading-card { font-size: 11px; color: var(--text-dim); letter-spacing: 0.08em; margin-top: 1px; }

  /* Permission / loading screens */
  #screen-perm, #screen-loading, #screen-error {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px; text-align: center; gap: 16px;
  }
  .screen-icon { font-size: 48px; opacity: 0.6; }
  .screen-title { font-size: 22px; font-weight: 600; color: var(--text); letter-spacing: 0.04em; }
  .screen-sub { font-size: 15px; color: var(--text-dim); line-height: 1.6; max-width: 280px; }
  .btn-perm {
    margin-top: 8px; padding: 12px 28px; border-radius: 8px;
    background: var(--amber); color: #000; font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px; font-weight: 700; letter-spacing: 0.08em;
    border: none; cursor: pointer; outline: none;
  }
  .btn-perm:active { opacity: 0.8; }

  /* Main content */
  #main { flex: 1; display: none; flex-direction: column; overflow: hidden; min-height: 0; }

  /* Radar */
  #radar-wrap {
    display: flex; justify-content: center; align-items: center;
    padding: 12px 16px 6px; background: var(--bg); flex-shrink: 0;
  }
  #radar-svg { width: 210px; height: 210px; }

  /* Stats bar */
  #stats-bar {
    display: flex; gap: 0; border-top: 1px solid var(--border-dim); border-bottom: 1px solid var(--border-dim);
    background: var(--bg2); flex-shrink: 0;
  }
  .stat-item { flex: 1; padding: 10px 8px; text-align: center; border-right: 1px solid var(--border-dim); }
  .stat-item:last-child { border-right: none; }
  .stat-val { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; color: var(--amber); }
  .stat-lbl { font-size: 11px; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }

  /* Aircraft list */
  #aircraft-list {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    padding: 12px;
    -webkit-overflow-scrolling: touch;
  }
  #aircraft-list > * + * { margin-top: 10px; }
  .aircraft-card {
    background: var(--bg2); border: 1px solid var(--border-dim); border-radius: 10px;
    padding: 12px 14px; position: relative; overflow: hidden;
    transition: border-color 0.2s;
  }
  .aircraft-card.ahead { border-left: 3px solid var(--green); }
  .aircraft-card.left  { border-left: 3px solid var(--blue); }
  .aircraft-card.right { border-left: 3px solid var(--amber); }
  .aircraft-card.behind{ border-left: 3px solid rgba(255,255,255,0.2); }

  .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .dir-badge {
    font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.1em; padding: 3px 8px; border-radius: 4px;
    flex-shrink: 0;
  }
  .dir-badge.ahead  { background: rgba(34,221,136,0.15); color: var(--green); border: 1px solid rgba(34,221,136,0.3); }
  .dir-badge.left   { background: rgba(68,170,255,0.12); color: var(--blue); border: 1px solid rgba(68,170,255,0.3); }
  .dir-badge.right  { background: rgba(240,160,32,0.12); color: var(--amber); border: 1px solid rgba(240,160,32,0.3); }
  .dir-badge.behind { background: rgba(255,255,255,0.06); color: var(--text-dim); border: 1px solid rgba(255,255,255,0.1); }

  .callsign { font-family: 'Space Mono', monospace; font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: 0.06em; }
  .airline { font-size: 13px; color: var(--text-dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .distance { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--amber); flex-shrink: 0; }

  .card-divider { height: 1px; background: var(--border-dim); margin-bottom: 10px; }

  .card-data { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .data-cell { text-align: center; }
  .data-val { font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; color: var(--text); }
  .data-lbl { font-size: 10px; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }

  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border-dim); }
  .aircraft-type { font-size: 12px; color: var(--text-dim); }
  .registration { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--text-dim); opacity: 0.7; }
  .on-ground-tag { font-size: 10px; letter-spacing: 0.06em; color: var(--amber); background: var(--amber-glow); padding: 2px 8px; border-radius: 3px; }

  /* Compass pulse — draws attention before it's enabled */
  @keyframes compass-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(240,160,32,0); background: transparent; }
    50%       { box-shadow: 0 0 0 6px rgba(240,160,32,0.12); background: rgba(240,160,32,0.06); }
  }
  #hdr-compass.pulsing {
    border-radius: 8px;
    animation: compass-pulse 2s ease-in-out infinite;
  }

  /* Sweep animation on radar */
  @keyframes sweep {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .radar-sweep { transform-origin: 110px 110px; animation: sweep 4s linear infinite; }

  /* Blip pulse */
  @keyframes blip { 0%,100% { opacity: 1; r: 4; } 50% { opacity: 0.5; r: 6; } }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--amber);
    animation: spin 0.9s linear infinite;
  }

  #refresh-bar {
    text-align: center; padding: 8px; font-size: 11px; color: var(--text-dim);
    font-family: 'Space Mono', monospace; letter-spacing: 0.06em;
    border-top: 1px solid var(--border-dim); background: var(--bg2);
    flex-shrink: 0;
  }
  .empty-msg { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 15px; }

  .route-row {
    display: flex; align-items: center; gap: 6px;
    margin: 8px 0 0; padding: 7px 10px; border-radius: 6px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border-dim);
    font-family: 'Space Mono', monospace; font-size: 11px;
  }
  .route-apt { color: var(--text); font-weight: 700; letter-spacing: 0.06em; }
  .route-apt-name { color: var(--text-dim); font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 400; }
  .route-arrow { color: var(--amber); opacity: 0.6; flex-shrink: 0; }
  .route-loading { color: var(--text-dim); font-size: 11px; font-style: italic; font-family: 'Barlow Condensed', sans-serif; }
  .route-none { color: var(--text-dim); font-size: 11px; font-family: 'Barlow Condensed', sans-serif; opacity: 0.6; }
</style>
</head>
<body>

<header>
  <div class="logo">SKY<span>WATCH</span></div>
  <!-- Compact compass (tappable to enable) -->
  <div id="hdr-compass" class="pulsing" onclick="requestCompass()" title="Tap to enable compass">
    <svg id="compass-svg-mini" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="15" cy="15" r="13.5" stroke="rgba(240,160,32,0.25)" stroke-width="1"/>
      <circle cx="15" cy="15" r="2" fill="rgba(240,160,32,0.4)"/>
      <text x="15" y="5.5" text-anchor="middle" fill="#f0a020" font-size="5" font-family="Space Mono" font-weight="700">N</text>
      <text x="26.5" y="16.5" text-anchor="middle" fill="#4b5563" font-size="4.5" font-family="Space Mono">E</text>
      <text x="15" y="28" text-anchor="middle" fill="#4b5563" font-size="4.5" font-family="Space Mono">S</text>
      <text x="3.5" y="16.5" text-anchor="middle" fill="#4b5563" font-size="4.5" font-family="Space Mono">W</text>
      <g id="compass-needle" style="transform-origin:15px 15px">
        <polygon points="15,5 13.5,15 15,13 16.5,15" fill="#f0a020" opacity="0.95"/>
        <polygon points="15,25 13.5,15 15,17 16.5,15" fill="#4b5563" opacity="0.7"/>
      </g>
    </svg>
    <div id="hdr-no-compass">TAP FOR<br>COMPASS</div>
    <div id="hdr-yes-compass">
      <div class="hdr-heading-deg"><span id="heading-val">---</span>°</div>
      <div class="hdr-heading-card" id="heading-card">--</div>
    </div>
  </div>
  <div class="status-pill red" id="status-pill">OFFLINE</div>
</header>

<!-- Permission screen -->
<div id="screen-perm">
  <div class="screen-icon">✈</div>
  <div class="screen-title">Enable Location</div>
  <div class="screen-sub">SkyWatch needs your location to find nearby aircraft and your device orientation to show directions.</div>
  <button class="btn-perm" id="btn-start">GRANT ACCESS</button>
</div>

<!-- Loading screen -->
<div id="screen-loading" style="display:none">
  <div class="spinner"></div>
  <div class="screen-sub">Scanning skies...</div>
</div>

<!-- Error screen -->
<div id="screen-error" style="display:none">
  <div class="screen-icon">⚠</div>
  <div class="screen-title">Connection Error</div>
  <div class="screen-sub" id="error-msg">Could not fetch aircraft data.</div>
  <button class="btn-perm" id="btn-retry">RETRY</button>
</div>

<!-- Main UI -->
<div id="main">

  <!-- Radar -->
  <div id="radar-wrap">
    <svg id="radar-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
      <!-- Rotating background: rings + crosshairs + cardinal labels spin as heading changes -->
      <g id="radar-bg" style="transform-origin:110px 110px">
        <circle cx="110" cy="110" r="54"  fill="none" stroke="rgba(240,160,32,0.08)" stroke-width="1"/>
        <circle cx="110" cy="110" r="108" fill="none" stroke="rgba(240,160,32,0.08)" stroke-width="1"/>
        <line x1="110" y1="2"   x2="110" y2="218" stroke="rgba(240,160,32,0.06)" stroke-width="0.5"/>
        <line x1="2"   y1="110" x2="218" y2="110" stroke="rgba(240,160,32,0.06)" stroke-width="0.5"/>
        <text x="113" y="57"  fill="rgba(240,160,32,0.35)" font-size="7" font-family="Space Mono">5nm</text>
        <text x="113" y="6"   fill="rgba(240,160,32,0.45)" font-size="7" font-family="Space Mono">10nm</text>
        <g class="radar-sweep">
          <path d="M110,110 L110,2 A108,108 0 0,1 208,70 Z" fill="rgba(240,160,32,0.04)"/>
        </g>
        <text x="110" y="13"  text-anchor="middle" fill="rgba(240,160,32,0.5)"  font-size="9" font-family="Space Mono" font-weight="700">N</text>
        <text x="207" y="114" text-anchor="middle" fill="rgba(240,160,32,0.3)"  font-size="8" font-family="Space Mono">E</text>
        <text x="110" y="216" text-anchor="middle" fill="rgba(240,160,32,0.3)"  font-size="8" font-family="Space Mono">S</text>
        <text x="13"  y="114" text-anchor="middle" fill="rgba(240,160,32,0.3)"  font-size="8" font-family="Space Mono">W</text>
      </g>
      <!-- Fixed layer: user dot, AHEAD label, blips -->
      <circle cx="110" cy="110" r="5"  fill="#f0a020" opacity="0.9"/>
      <circle cx="110" cy="110" r="10" fill="none" stroke="#f0a020" stroke-width="1" opacity="0.4"/>
      <!-- AHEAD always at top -->
      <text x="110" y="21" text-anchor="middle" fill="rgba(34,221,136,0.75)" font-size="8" font-family="Space Mono" font-weight="700">▲ AHEAD</text>
      <!-- Blips placed in heading-relative coords by JS -->
      <g id="radar-blips"></g>
    </svg>
  </div>

  <!-- Stats -->
  <div id="stats-bar">
    <div class="stat-item"><div class="stat-val" id="s-count">0</div><div class="stat-lbl">Aircraft</div></div>
    <div class="stat-item"><div class="stat-val" id="s-ahead">0</div><div class="stat-lbl">Ahead</div></div>
    <div class="stat-item"><div class="stat-val" id="s-range">—</div><div class="stat-lbl">Closest</div></div>
    <div class="stat-item"><div class="stat-val" id="s-alt">—</div><div class="stat-lbl">Max Alt</div></div>
  </div>

  <!-- Aircraft cards -->
  <div id="aircraft-list"></div>

  <!-- Refresh bar -->
  <div id="refresh-bar">NEXT SCAN IN <span id="countdown">5</span>s</div>
</div>

function airportName(icao) {
  if (!icao) return '';
  return AIRPORTS[icao.toUpperCase()] || icao;
}

// Route cache: callsign -> { origin, dest } | 'loading' | 'none'
const routeCache = new Map();

async function fetchRoute(callsign) {
  const cs = (callsign || '').trim().toUpperCase();
  if (!cs || cs === '???' || cs.length < 3) return;
  if (routeCache.has(cs)) return;
  routeCache.set(cs, 'loading');

  try {
    // adsbdb.com is CORS-enabled and returns route + airport names in one call
    const res = await fetch(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(cs)}`);
    if (!res.ok) { routeCache.set(cs, 'none'); updateRouteRow(cs); return; }
    const data = await res.json();
    const fr = data?.response?.flightroute;
    if (fr && fr.origin?.icao_code && fr.destination?.icao_code) {
      routeCache.set(cs, {
        origin: fr.origin.icao_code,
        originName: fr.origin.name || fr.origin.municipality || '',
        originCountry: fr.origin.iso_country || '',
        dest: fr.destination.icao_code,
        destName: fr.destination.name || fr.destination.municipality || '',
        destCountry: fr.destination.iso_country || '',
      });
    } else {
      routeCache.set(cs, 'none');
    }
  } catch {
    routeCache.set(cs, 'none');
  }
  updateRouteRow(cs);
}

function updateRouteRow(cs) {
  const el = document.getElementById('route-' + cs.replace(/[^A-Z0-9]/g, ''));
  if (!el) return;
  el.innerHTML = buildRouteHTML(cs);
}

function buildRouteHTML(cs) {
  const r = routeCache.get(cs);
  if (!r || r === 'loading') return '<span class="route-loading">looking up route...</span>';
  if (r === 'none') return '<span class="route-none">route unavailable</span>';
  // Use adsbdb name, falling back to local table, falling back to ICAO code
  const oName = r.originName || airportName(r.origin);
  const dName = r.destName  || airportName(r.dest);
  const oLabel = oName !== r.origin ? oName : '';
  const dLabel = dName !== r.dest   ? dName : '';
  return `<span class="route-apt">${r.origin}</span>${oLabel ? `<span class="route-apt-name">&thinsp;${oLabel}</span>` : ''}
    <span class="route-arrow">→</span>
    <span class="route-apt">${r.dest}</span>${dLabel ? `<span class="route-apt-name">&thinsp;${dLabel}</span>` : ''}`;
}

async function fetchAllRoutes(list) {
  // Fetch routes for the 10 closest aircraft with real callsigns, staggered slightly
  const withCallsign = list.filter(a => (a.flight || '').trim().length > 2).slice(0, 10);
  for (const a of withCallsign) {
    const cs = (a.flight || '').trim().toUpperCase();
    // Check if airplanes.live already gave us route data (various field names)
    const fromIcao = a.from_icao || a.depIcao || a.dep || a.origin;
    const toIcao   = a.to_icao   || a.arrIcao || a.arr || a.destination;
    if (fromIcao && toIcao) {
      routeCache.set(cs, {
        origin: fromIcao, originName: airportName(fromIcao),
        dest: toIcao,     destName:   airportName(toIcao),
      });
      updateRouteRow(cs);
    } else if (!routeCache.has(cs)) {
      fetchRoute(cs);
      await new Promise(r => setTimeout(r, 120)); // stagger to avoid hammering API
    } else {
      updateRouteRow(cs); // cached, just paint it
    }
  }
}

let userLat = null, userLon = null;
let compassHeading = null;
let compassGranted = false;
let aircraft = [];
let countdownVal = REFRESH_INTERVAL;
let countdownTimer = null;
let refreshTimer = null;

// --- Utility ---
function toRad(d) { return d * Math.PI / 180; }
function toDeg(r) { return r * 180 / Math.PI; }

function getBearing(lat1, lon1, lat2, lon2) {
  const φ1 = toRad(lat1), φ2 = toRad(lat2);
  const Δλ = toRad(lon2 - lon1);
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function getDistanceNM(lat1, lon1, lat2, lon2) {
  const R = 3440.065;
  const φ1 = toRad(lat1), φ2 = toRad(lat2);
  const Δφ = toRad(lat2 - lat1);
  const Δλ = toRad(lon2 - lon1);
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function getRelativeDir(bearing) {
  if (compassHeading === null) return 'bearing';
  const rel = (bearing - compassHeading + 360) % 360;
  if (rel < 45 || rel >= 315) return 'ahead';
  if (rel >= 45 && rel < 135) return 'right';
  if (rel >= 135 && rel < 225) return 'behind';
  return 'left';
}

function getDirLabel(dir) {
  const labels = { ahead:'AHEAD', right:'RIGHT', left:'LEFT', behind:'BEHIND', bearing:'N/A' };
  return labels[dir] || 'N/A';
}

function toCardinal(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

function formatAlt(ft) {
  if (ft === null || ft === undefined || isNaN(ft)) return '---';
  return Math.round(ft).toLocaleString() + ' ft';
}
function formatSpeed(kts) {
  if (kts === null || kts === undefined || isNaN(kts)) return '---';
  return Math.round(kts) + ' kt';
}
function formatHeading(deg) {
  if (deg === null || deg === undefined || isNaN(deg)) return '---';
  return Math.round(deg) + '°';
}

function getAirline(callsign) {
  if (!callsign || callsign.trim() === '') return 'Unknown';
  const icao = callsign.trim().substring(0, 3).toUpperCase();
  return AIRLINES[icao] || callsign.trim();
}

function getAircraftName(t) {
  if (!t) return '';
  return AIRCRAFT_TYPES[t.toUpperCase()] || t.toUpperCase();
}

// --- Compass ---
function requestCompass() {
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(state => {
      if (state === 'granted') {
        window.addEventListener('deviceorientation', onOrientation, true);
        compassGranted = true;
      }
    }).catch(() => {});
  } else {
    window.addEventListener('deviceorientationabsolute', onAbsOrientation, true);
    window.addEventListener('deviceorientation', onOrientation, true);
    compassGranted = true;
  }
}

function onAbsOrientation(e) {
  if (e.absolute && e.alpha !== null) {
    compassHeading = (360 - e.alpha) % 360;
    updateCompassUI();
  }
}

function onOrientation(e) {
  if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
    compassHeading = e.webkitCompassHeading;
    updateCompassUI();
  } else if (e.absolute && e.alpha !== null) {
    compassHeading = (360 - e.alpha) % 360;
    updateCompassUI();
  }
}

function updateCompassUI() {
  if (compassHeading === null) return;
  // Stop pulsing once compass is active
  document.getElementById('hdr-compass').classList.remove('pulsing');
  document.getElementById('hdr-no-compass').style.display = 'none';
  document.getElementById('hdr-yes-compass').style.display = 'block';
  document.getElementById('heading-val').textContent = Math.round(compassHeading);
  document.getElementById('heading-card').textContent = toCardinal(compassHeading);
  // Rotate mini compass needle so N stays correct
  document.getElementById('compass-needle').style.transform = `rotate(${-compassHeading}deg)`;
  // Rotate radar background so your heading is always at top
  const bg = document.getElementById('radar-bg');
  if (bg) bg.style.transform = `rotate(${-compassHeading}deg)`;
  // Re-render blips with updated relative angles (if aircraft loaded)
  if (aircraft.length > 0) renderAll();
}


// --- Fetch aircraft ---
// airplanes.live locked its /v2/point endpoint behind an API key, so we use
// free, keyless, "drop-in compatible" mirrors of the same ADSBExchange-style
// API instead. They return identical JSON (same "ac" array, same field
// names: flight, r, t, alt_baro, gs, track, lat, lon, ...), so nothing else
// in this file needs to change. Try adsb.lol first, fall back to adsb.fi if
// it's ever down/rate-limited.
const ADSB_SOURCES = [
  (lat, lon, r) => `https://api.adsb.lol/v2/point/${lat}/${lon}/${r}`,
  (lat, lon, r) => `https://opendata.adsb.fi/api/v2/lat/${lat}/lon/${lon}/dist/${r}`,
];

async function fetchFromSource(buildUrl) {
  const url = buildUrl(userLat.toFixed(4), userLon.toFixed(4), RADIUS_NM);
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 8000);
  try {
    const res = await fetch(url, { signal: controller.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return data.ac || [];
  } finally {
    clearTimeout(timeout);
  }
}

async function fetchAircraft() {
  if (userLat === null) return;
  setStatus('scanning');
  let lastErr = null;
  for (const buildUrl of ADSB_SOURCES) {
    const url = buildUrl(userLat.toFixed(4), userLon.toFixed(4), RADIUS_NM);
    try {
      const ac = await fetchFromSource(buildUrl);
      aircraft = ac.filter(a => a.lat && a.lon);
      renderAll();
      setStatus('live');
      startCountdown();
      return;
    } catch (err) {
      lastErr = err;
      console.warn(`ADS-B source failed (${url}):`, err);
    }
  }
  console.error(lastErr);
  if (aircraft.length === 0) {
    // Surface the real reason instead of a generic message, so it's
    // possible to tell a CORS block, a timeout, and a bad response apart.
    const reason = lastErr ? (lastErr.name === 'AbortError' ? 'request timed out' : lastErr.message) : 'unknown error';
    showError(`Could not connect to ADS-B feed (${reason}). Check your connection and try again.`);
  } else {
    setStatus('stale');
  }
  startCountdown();
}

function startCountdown() {
  clearInterval(countdownTimer);
  clearTimeout(refreshTimer);
  countdownVal = REFRESH_INTERVAL;
  document.getElementById('countdown').textContent = countdownVal;
  countdownTimer = setInterval(() => {
    countdownVal--;
    document.getElementById('countdown').textContent = Math.max(0, countdownVal);
    if (countdownVal <= 0) { clearInterval(countdownTimer); fetchAircraft(); }
  }, 1000);
}

function setStatus(state) {
  const pill = document.getElementById('status-pill');
  if (state === 'live')     { pill.className = 'status-pill green'; pill.textContent = 'LIVE'; }
  else if (state === 'scanning') { pill.className = 'status-pill'; pill.textContent = 'SCANNING'; }
  else if (state === 'stale')    { pill.className = 'status-pill'; pill.textContent = 'STALE'; }
  else                      { pill.className = 'status-pill red'; pill.textContent = 'OFFLINE'; }
}

// --- Render ---
function renderAll() {
  const enriched = aircraft.map(a => {
    const bearing = getBearing(userLat, userLon, a.lat, a.lon);
    const distNM = getDistanceNM(userLat, userLon, a.lat, a.lon);
    const dir = getRelativeDir(bearing);
    return { ...a, bearing, distNM, dir };
  }).sort((a, b) => a.distNM - b.distNM);

  renderStats(enriched);
  renderRadar(enriched);
  renderCards(enriched);
  fetchAllRoutes(enriched);
}

function renderStats(list) {
  document.getElementById('s-count').textContent = list.length;
  const ahead = compassHeading !== null ? list.filter(a => a.dir === 'ahead').length : '—';
  document.getElementById('s-ahead').textContent = ahead;
  const closest = list.length ? list[0].distNM.toFixed(1) + 'nm' : '—';
  document.getElementById('s-range').textContent = closest;
  const alts = list.map(a => a.alt_baro || a.alt_geom).filter(v => v && !isNaN(v));
  const maxAlt = alts.length ? (Math.max(...alts) / 1000).toFixed(0) + 'k' : '—';
  document.getElementById('s-alt').textContent = maxAlt;
}

const DIR_COLORS = { ahead:'#22dd88', right:'#f0a020', left:'#44aaff', behind:'rgba(255,255,255,0.3)', bearing:'#f0a020' };

function renderRadar(list) {
  const blipsEl = document.getElementById('radar-blips');
  const maxR = RADIUS_NM;
  const cx = 110, cy = 110, pxR = 108;
  let html = '';
  list.slice(0, 20).forEach(a => {
    // Heading-up: subtract compass heading so "ahead" is always at top
    const relAngle = compassHeading !== null
      ? toRad(a.bearing - compassHeading)
      : toRad(a.bearing);
    const r = Math.min(a.distNM / maxR, 1) * pxR;
    const x = (cx + Math.sin(relAngle) * r).toFixed(1);
    const y = (cy - Math.cos(relAngle) * r).toFixed(1);
    const col = DIR_COLORS[a.dir] || '#f0a020';
    const cs = (a.flight || '').trim() || (a.r || '').trim() || '???';
    html += `<circle cx="${x}" cy="${y}" r="4" fill="${col}" opacity="0.9"/>
      <text x="${x}" y="${(parseFloat(y)-7).toFixed(1)}" text-anchor="middle" fill="${col}" font-size="7" font-family="Space Mono" opacity="0.85">${cs}</text>`;
  });
  blipsEl.innerHTML = html;
}

function renderCards(list) {
  const el = document.getElementById('aircraft-list');
  if (list.length === 0) {
    el.innerHTML = '<div class="empty-msg">No aircraft detected within ' + RADIUS_NM + ' nm.<br><br>The sky looks clear above you.</div>';
    return;
  }
  el.innerHTML = list.map(a => {
    const cs = (a.flight || '').trim() || '???';
    const csId = cs.replace(/[^A-Z0-9]/g, '');
    const airline = getAirline(a.flight || '');
    const typeStr = getAircraftName(a.t || '');
    const reg = (a.r || '').trim();
    const alt = a.alt_baro || a.alt_geom;
    const spd = a.gs;
    const trk = a.track;
    const dir = a.dir;
    const onGround = a.alt_baro === 'ground' || (alt && alt < 100 && Math.abs(spd || 0) < 30) || a.on_ground === true;
    // Pre-populate route if already cached
    const cachedRoute = cs !== '???' ? buildRouteHTML(cs) : '<span class="route-loading">looking up route...</span>';

    return `<div class="aircraft-card ${dir}">
      <div class="card-top">
        <span class="dir-badge ${dir}">${getDirLabel(dir)}</span>
        <span class="callsign">${cs}</span>
        <span style="flex:1"></span>
        <span class="distance">${a.distNM.toFixed(1)} nm</span>
      </div>
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px;">${airline !== cs ? airline : ''}</div>
      <div class="route-row" id="route-${csId}">${cachedRoute}</div>
      <div class="card-divider" style="margin-top:10px;"></div>
      <div class="card-data">
        <div class="data-cell">
          <div class="data-val">${onGround ? 'GND' : (alt ? (Math.round(alt/100)*100).toLocaleString() : '---')}</div>
          <div class="data-lbl">ALT (ft)</div>
        </div>
        <div class="data-cell">
          <div class="data-val">${formatSpeed(spd)}</div>
          <div class="data-lbl">SPEED</div>
        </div>
        <div class="data-cell">
          <div class="data-val">${formatHeading(trk)}</div>
          <div class="data-lbl">HEADING</div>
        </div>
      </div>
      <div class="card-footer">
        <span class="aircraft-type">${typeStr || 'Unknown type'}</span>
        ${reg ? `<span class="registration">${reg}</span>` : ''}
        ${onGround ? '<span class="on-ground-tag">ON GROUND</span>' : ''}
      </div>
    </div>`;
  }).join('');
}

function showMain() {
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('main').style.display = 'flex';
}
function showError(msg) {
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('main').style.display = 'none';
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('screen-error').style.display = 'flex';
}

function startApp() {
  document.getElementById('screen-perm').style.display = 'none';
  document.getElementById('screen-loading').style.display = 'flex';
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
    showMain();
    fetchAircraft();
    // Watch for position updates
    navigator.geolocation.watchPosition(p => {
      userLat = p.coords.latitude;
      userLon = p.coords.longitude;
    }, null, { enableHighAccuracy: true });
  }, err => {
    showError('Location access denied. SkyWatch needs GPS to find nearby aircraft.');
  }, { enableHighAccuracy: true, timeout: 10000 });
}

document.getElementById('btn-start').addEventListener('click', startApp);
document.getElementById('btn-retry').addEventListener('click', () => {
  document.getElementById('screen-error').style.display = 'none';
  if (userLat !== null) fetchAircraft();
  else startApp();
});

// Auto-start if geo was already granted (no prompt needed on revisit)
if (navigator.permissions) {
  navigator.permissions.query({ name: 'geolocation' }).then(result => {
    if (result.state === 'granted') startApp();
  }).catch(() => {});
}
</script>
</body>
